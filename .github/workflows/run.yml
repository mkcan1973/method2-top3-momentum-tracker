name: Run method2 top-3 momentum tracker
"on":
  schedule:
    - cron: "0 21 * * 1-5"   # weekdays, 21:00 UTC (after US market close)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Update holdings and rebuild dashboard
        run: python run_daily.py
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add equity_history.csv rebalance_log.csv index.html sp500_constituents.json
          git diff --staged --quiet || git commit -m "Run: $(date -u +%Y-%m-%dT%H:%M)Z"
          git push
